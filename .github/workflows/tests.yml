# The rule in CLAUDE.md, enforced by a machine instead of by memory:
#
#     `pytest tests/ -q` must pass before any commit, and LIVE mode
#     must never be run without it.
#
# Two jobs, because they are not the same kind of evidence:
#
#   tests    — the GATE. Pure Python against fakes, no MT5, no browser,
#              no network. Deterministic and fast (~10s). This is the
#              one to require in branch protection.
#   browser  — Chromium under Playwright, which is the only thing that
#              can see a script error that silently unregisters a UI
#              handler. Informative, NOT a gate yet — see its comment.
#
# MetaTrader5 is Windows-only and requirements.txt marks it
# `sys_platform == "win32"`, so the whole suite installs and runs on
# Linux. `mt5trader/broker.py` is the only module that imports it and
# it falls back to `mt5 = None` off-Windows; the tests drive fakes.

name: tests

on:
  pull_request:
  push:
    branches:
      - main
      # The default branch is still claude/monitoring-…-17nyys until the
      # migration to `main`. Named so trunk is covered NOW; delete this
      # line once `main` is the default.
      - claude/monitoring-positions-market-grid-17nyys

# A superseded push should not keep burning a runner — the answer that
# matters is the one for the current head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest tests/ -q
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 3.11, because that is what the launcher and README tell the desk
      # to run (`py -3.11 start.py`). CI proving a version nobody
      # deploys is CI proving the wrong thing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The browser tests skip cleanly with no Chromium installed —
      # `pytest.importorskip` on the module, and a skip on launch
      # failure. Verified: 792 passed, 148 skipped on a runner with no
      # browsers.
      - name: Run the suite
        run: pytest tests/ -q

  browser:
    name: UI in Chromium (not a gate yet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DO NOT add this to required status checks yet, and do NOT wrap it
    # in continue-on-error to make it green — a check that always passes
    # is worth exactly nothing, and one that is always red is worse than
    # nothing because it teaches the desk to ignore a red mark.
    #
    # Measured in a constrained container: 7-12 of ~143 fail per run,
    # a DIFFERENT set each time, on code that is not being changed —
    # timing flake, not real failures. GitHub's runners are better
    # resourced and may well be stable. Watch this job for a week or
    # two: if it comes back green consistently, make it required. If it
    # stays flaky, fix the flaky tests before promoting it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run the browser suite
        run: pytest tests/test_ui_browser.py -q
